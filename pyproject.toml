[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-multitool"
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = [
    "Pillow>=9.0.0",
    "pandas>=1.3.0",
    "requests>=2.28.0",
    "tqdm>=4.64.0",
    "openpyxl>=3.0.0",
    "pillow-heif>=0.12.0",
    "numpy",
    "opencv-contrib-python-headless",
]

[project.scripts]
image-multitool = "image_multitool.app:main"

[tool.setuptools.dynamic]
version = { attr = "image_multitool.version.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
